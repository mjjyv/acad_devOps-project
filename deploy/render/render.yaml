# ==============================================================================
# RENDER CLOUD BLUEPRINT SPECIFICATION (INFRASTRUCTURE-AS-CODE)
# File: deploy/render/render.yaml
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND WEB CLIENT (NEXT.JS 15 BRUTALIST UI)
  # ----------------------------------------------------------------------------
  - type: web
    name: acad-web-client
    runtime: node
    plan: free
    region: singapore # hoặc oregon / frankfurt
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm --filter @acad/web exec next start -p $PORT -H 0.0.0.0
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        value: https://acad-core-api.onrender.com

  # ----------------------------------------------------------------------------
  # 2. BACKEND API GATEWAY & CORE ENGINES (DOCKER WEB SERVICE)
  # ----------------------------------------------------------------------------
  - type: web
    name: acad-core-api
    runtime: docker
    plan: free
    region: singapore # hoặc oregon / frankfurt
    dockerfilePath: deploy/docker/Dockerfile.api.prod
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false # Connection string tới Managed PostgreSQL (Supabase / Render DB / Neon)
      - key: REDIS_URL
        sync: false # Connection string tới Upstash Redis / Managed Redis
      - key: JWT_SECRET
        generateValue: true # Render tự động sinh chuỗi secret ngẫu nhiên bảo mật cao
