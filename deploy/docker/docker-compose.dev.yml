services:
  infra-db:
    image: postgres:16-alpine
    container_name: acad-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acad_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-acad_monorepo}
    ports:
      - "5432:5432"
    volumes:
      - acad_dev_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acad} -d ${POSTGRES_DB:-acad_monorepo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  infra-cache:
    image: redis:7-alpine
    container_name: acad-dev-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  acad_dev_pgdata:
    driver: local
