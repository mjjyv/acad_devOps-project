name: CI Pipeline (Quality & Automation Gates)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================================================
  # CỔNG 1: KIỂM TRA QUY CHUẨN MÃ NGUỒN & FORMAT (LINTING GATE)
  # ============================================================================
  lint:
    name: "Cổng 1: Lint & Code Formatting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter check
        run: |
          if [ -f "biome.json" ]; then
            echo "Biome linter configuration detected."
          fi

  # ============================================================================
  # CỔNG 2: KIỂM ĐỊNH TÍNH TOÀN VẸN KIỂU DỮ LIỆU (TYPE INTEGRITY GATE)
  # ============================================================================
  typecheck:
    name: "Cổng 2: TypeScript & OpenAPI Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript schemas across all packages
        run: pnpm run typecheck

  # ============================================================================
  # CỔNG 3: BỘ KIỂM THỬ TỰ ĐỘNG (AUTOMATED TEST SUITES GATE)
  # ============================================================================
  test:
    name: "Cổng 3: Unit & Integration Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all 33+ test suites
        run: pnpm test

  # ============================================================================
  # CỔNG 4: THỬ NGHIỆM ĐÓNG GÓI DOCKER (CONTAINER BUILD VERIFICATION)
  # ============================================================================
  docker-check:
    name: "Cổng 4: Dockerfiles Syntax & Build Check"
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose syntax
        run: |
          docker compose -f deploy/docker/docker-compose.dev.yml config --quiet
          echo "docker-compose.dev.yml syntax is valid."
