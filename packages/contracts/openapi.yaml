openapi: 3.1.0
info:
  title: Acad DevOps Platform API Contracts
  version: 2.0.0
  description: Single Source of Truth for Acad DevOps Platform APIs across all services and gateways.
servers:
  - url: /api/v1
    description: Current Base API Path

paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản người dùng mới
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201':
          description: Đăng ký thành công
        '400':
          description: Dữ liệu không hợp lệ (RFC 7807)
        '409':
          description: Tên đăng nhập hoặc email đã tồn tại

  /auth/login:
    post:
      summary: Xác thực người dùng và khởi tạo phiên
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string }
                password: { type: string }
                fingerprint: { type: string }
      responses:
        '200':
          description: Đăng nhập thành công, cấp Access Token và Refresh Cookie
        '401':
          description: Sai thông tin đăng nhập hoặc tài khoản bị khóa

  /auth/refresh:
    post:
      summary: Xoay vòng Refresh Token (Token Rotation kèm 30s Grace Period)
      operationId: refreshToken
      responses:
        '200':
          description: Cấp Access Token mới
        '401':
          description: Refresh Token hết hạn hoặc không hợp lệ
        '403':
          description: Phát hiện Token Reuse Attack (Hủy toàn bộ cụm phiên)

  /auth/logout:
    post:
      summary: Đăng xuất và thu hồi phiên làm việc hiện tại
      operationId: logoutUser
      responses:
        '200':
          description: Đăng xuất thành công

  /spaces:
    get:
      summary: Lấy danh sách không gian thảo luận
      operationId: listSpaces
      responses:
        '200':
          description: Danh sách không gian
    post:
      summary: Tạo không gian mới
      operationId: createSpace
      responses:
        '201':
          description: Tạo không gian thành công

  /threads:
    get:
      summary: Lấy danh sách bài viết thảo luận (Hot/New/Top/Best)
      operationId: listThreads
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [hot, new, top, best], default: hot }
        - name: time
          in: query
          schema: { type: string, enum: [day, week, month, year, all], default: all }
        - name: cursor
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Danh sách bài viết kèm con trỏ Base64

  /threads/{id}/vote:
    post:
      summary: Bỏ phiếu nguyên tử qua Redis Lua
      operationId: voteThread
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: integer, enum: [1, -1] }
      responses:
        '200':
          description: Kết quả bầu chọn

  /threads/{id}/comments:
    get:
      summary: Lấy cây bình luận ltree Base36
      operationId: getThreadComments
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cây bình luận trải phẳng O(N) kèm cờ Capped Depth 8

  /chat/channels:
    get:
      summary: Lấy danh sách phòng chat tham gia
      operationId: listChatChannels
      responses:
        '200':
          description: Danh sách phòng chat

  /chat/requests:
    get:
      summary: Lấy danh sách yêu cầu tin nhắn lạ đang chờ duyệt
      operationId: listChatRequests
      responses:
        '200':
          description: Hàng đợi chat requests

  /admin/stats:
    get:
      summary: Thống kê thời gian thực toàn hệ thống
      operationId: getAdminStats
      responses:
        '200':
          description: Số liệu thống kê
        '403':
          description: Chặn truy cập nếu không phải ADMIN
